<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02030c">
<meta name="description" content="Đàn đom đóm: món đồ chơi tương tác, rê chuột hoặc chạm để điều khiển hàng trăm chú đom đóm phát sáng. By ruii9326 (Nguyễn Duy Anh).">
<meta name="author" content="ruii9326 (Nguyễn Duy Anh)">
<meta property="og:title" content="Đàn đom đóm">
<meta property="og:description" content="Rê chuột hoặc chạm để điều khiển đàn đom đóm phát sáng.">
<title>Đàn đom đóm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23ffc857' fill-opacity='.25'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffc857'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --deep:#0a1128; --ink:#e8ecff; --dim:#a2acd9; --line:#2f3c70; --amber:#ffc857;
  --panel:rgba(8,13,34,.8);
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
html{background:#02030a}
/* bầu trời sao đêm: nền chuyển màu từ đen chàm ở đỉnh tới tím hồng ở chân trời.
   Dải ngân hà và các vì sao được vẽ trên canvas #bg và #sky. */
body{
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  background:
    radial-gradient(ellipse 125% 52% at 50% 118%,rgba(190,92,160,.40) 0%,rgba(112,72,186,.30) 38%,rgba(112,72,186,0) 74%),
    radial-gradient(ellipse 56% 40% at 86% 14%,rgba(66,98,208,.24) 0%,rgba(66,98,208,0) 70%),
    radial-gradient(ellipse 50% 36% at 10% 42%,rgba(126,70,176,.17) 0%,rgba(126,70,176,0) 70%),
    linear-gradient(180deg,#010208 0%,#040a22 36%,#0b1546 68%,#1e1a5a 100%)}
canvas{position:fixed;top:0;left:0;inset:0;width:100%;height:100%;display:block}
#bg,#sky{pointer-events:none}
#c{touch-action:none;cursor:crosshair}
.title{position:fixed;left:max(20px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 18px);pointer-events:none;
  max-width:calc(100vw - 150px);text-shadow:0 1px 10px rgba(2,3,12,.95)}
.title h1{margin:0;font-size:1.35rem;font-weight:600;letter-spacing:.01em}
.title p{margin:.35rem 0 0;font-size:.85rem;line-height:1.5;color:var(--dim)}
.title .credit{display:flex;align-items:center;gap:8px;margin-top:.6rem;font-size:.78rem;color:var(--ink);opacity:.85}
.credit i{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px 2px rgba(255,200,87,.7);animation:blink 3.2s ease-in-out infinite}
.title .tip{margin:.6rem 0 0;font-size:.8rem;line-height:1.5;color:var(--amber)}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
button{font:inherit;font-size:.82rem;color:var(--ink);background:transparent;border:0;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.panel-toggle{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 14px);
  border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px 12px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;justify-content:center;
  width:max-content;max-width:calc(100vw - 24px);padding:7px 10px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bar.hide{display:none}
.btn{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.78rem}
.btn[aria-disabled="true"]{opacity:.35;cursor:default}
.modewrap{position:relative}
#modebtn{display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg{position:absolute;left:0;bottom:calc(100% + 14px);display:flex;flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;gap:2px;padding:6px;min-width:190px;
  max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);overflow-y:auto;border:1px solid var(--line);border-radius:14px;
  background:rgba(10,17,40,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.seg[hidden]{display:none}
.seg button{flex:0 0 auto;border:0;border-radius:9px;padding:10px 14px;text-align:left;white-space:nowrap;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--deep)}
.seg button.has-need{display:flex;justify-content:space-between;align-items:center;gap:18px}
.need{font-size:.74em;color:var(--dim)}
.seg button[aria-pressed="true"] .need{color:#56608f}
.seg button[aria-disabled="true"]{opacity:.5}
.dots{display:flex;gap:6px;padding:0 2px}
.dot{width:18px;height:18px;border-radius:50%;padding:0;border:2px solid transparent}
.dot[aria-pressed="true"]{border-color:var(--ink)}
.count{font-size:.74rem;color:var(--dim);min-width:3.6em;text-align:right}
@media (hover:hover){.btn:not([aria-disabled="true"]):hover{border-color:var(--dim)}}
/* tablet và mọi màn hình cảm ứng: nút to hơn cho dễ chạm */
@media (pointer:coarse){
  .dot{width:28px;height:28px}
  .btn{padding:10px 14px;font-size:.84rem}
  .seg button{padding:13px 16px;font-size:.92rem}
  .count{font-size:.8rem}
}
/* điện thoại */
@media (max-width:640px){
  .title{max-width:calc(100vw - 130px)}
  .title h1{font-size:1.15rem}
  .title p{font-size:.78rem}
  .bar{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));transform:none;width:auto;max-width:none;
    gap:6px;padding:6px 8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
  .seg{min-width:min(240px,calc(100vw - 32px))}
  .dots{order:3;flex:1 1 100%;justify-content:space-between;gap:0;padding:2px 4px}
  .dot{width:26px;height:26px}
  .btn{flex:0 0 auto;padding:9px 11px;font-size:.78rem}
  .count{margin-left:auto;min-width:0}
}
/* màn hình thấp (điện thoại nằm ngang): thu gọn chữ để không che đàn đom đóm */
@media (max-height:480px){
  .title{top:calc(env(safe-area-inset-top,0px) + 10px)}
  .title h1{font-size:1.05rem}
  .title p{font-size:.72rem;margin-top:.25rem}
  .title .credit{margin-top:.35rem}
  .panel-toggle{top:calc(env(safe-area-inset-top,0px) + 8px)}
  .bar{bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}
  .seg{max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px)}
}
@media (prefers-reduced-motion:reduce){#c{cursor:default}.credit i{animation:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="c" role="img" aria-label="Đàn đom đóm: rê chuột hoặc chạm để điều khiển"></canvas>
<div class="title">
  <h1>Đàn đom đóm</h1>
  <p id="hint">Giữ chuột để đàn đom đóm làm theo chế độ bạn chọn. Nhả chuột ra thì chúng bay tự do.</p>
  <p class="tip" id="tip"></p>
  <p class="credit"><i></i><span>by ruii9326 (Nguyễn Duy Anh)</span></p>
</div>
<button class="panel-toggle" id="toggle" type="button" aria-expanded="true" aria-controls="bar">Ẩn bảng</button>
<div class="bar" id="bar" role="group" aria-label="Điều khiển">
  <div class="modewrap"><button class="btn" id="modebtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="modes">☰ <span id="modename">Bay theo</span> ▾</button>
  <div class="seg" id="modes" role="group" aria-label="Chế độ" hidden>
    <button type="button" data-m="follow" aria-pressed="true">Bay theo</button>
    <button type="button" data-m="swirl" aria-pressed="false">Xoáy</button>
    <button type="button" data-m="hole" aria-pressed="false">Hố đen</button>
    <button type="button" class="has-need" data-m="blast" aria-pressed="false" aria-disabled="true"><span class="lbl">Vụ nổ</span><small class="need" id="need">từ 600 chú</small></button>
    <button type="button" data-m="fire" aria-pressed="false">Pháo hoa</button>
    <button type="button" data-m="shape" aria-pressed="false">Tạo hình</button>
    <button type="button" data-m="flock" aria-pressed="false">Bầy</button>
    <button type="button" data-m="trail" aria-pressed="false">Vẽ sáng</button>
    <button type="button" data-m="sync" aria-pressed="false">Nhấp nháy</button>
    <button type="button" data-m="flee" aria-pressed="false">Tản ra</button>
  </div></div>
  <div class="dots" id="dots">
    <button type="button" class="dot" data-c="0" style="background:#ffc857" aria-label="Màu hổ phách" aria-pressed="true"></button>
    <button type="button" class="dot" data-c="1" style="background:#6fe3d6" aria-label="Màu xanh ngọc" aria-pressed="false"></button>
    <button type="button" class="dot" data-c="2" style="background:#ff7a90" aria-label="Màu hồng" aria-pressed="false"></button>
    <button type="button" class="dot" data-c="3" style="background:#96e66e" aria-label="Màu xanh lá" aria-pressed="false"></button>
    <button type="button" class="dot" data-c="4" style="background:#6eaaff" aria-label="Màu xanh dương" aria-pressed="false"></button>
    <button type="button" class="dot" data-c="5" style="background:#b98cff" aria-label="Màu tím" aria-pressed="false"></button>
    <button type="button" class="dot" data-c="6" style="background:conic-gradient(#ffc857,#6fe3d6,#ff7a90,#96e66e,#6eaaff,#b98cff,#ffc857)" aria-label="Tất cả màu" aria-pressed="false"></button>
  </div>
  <button type="button" class="btn" id="less" aria-disabled="false" title="Giảm 50 chú (tối thiểu 100). Giữ để giảm nhanh.">−50</button>
  <button type="button" class="btn" id="more" aria-disabled="false" title="Thả thêm 50 chú (tối đa 1500). Giữ để thả nhanh.">+50</button>
  <button type="button" class="btn" id="reset" title="Về lại 150 chú">Làm lại</button>
  <span class="count" id="count" aria-live="polite"></span>
</div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),
      bgc=document.getElementById('bg'),bctx=bgc.getContext('2d'),
      sk=document.getElementById('sky'),sctx=sk.getContext('2d');
  var touch=!!(window.matchMedia&&matchMedia('(pointer: coarse)').matches);
  var reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  var W=0,H=0,DPR=1,oldW=0,oldH=0,rsT=0;
  /* số lượng đom đóm: luôn nằm trong khoảng MIN..MAX, mở web lên là DEF */
  var MIN=100,MAX=1500,DEF=150,STEP=50;
  /* hướng tia sáng của hố đen: PC bắn ngang, điện thoại bắn dọc, tablet theo chiều dài của màn hình */
  var JV=false,JSPAN=400;
  var COLORS=[[255,200,87],[111,227,214],[255,122,144],[150,230,110],[110,170,255],[185,140,255]];
  var sprites=COLORS.map(makeSprite),core=makeCore();
  var color=0,mode='follow',flies=[],last=0,pw=0,pr=0,fw=null,fl=null,rp=null,hb=0,fa=16.7,lite=false;
  var ptr={x:0,y:0,active:false,down:false,t0:0},pid=-1,lx=0,ly=0,cvx=0,cvy=0;
  var trl=[],head=new Int32Array(0),nxt=new Int32Array(0),shapeIdx=0,spts=null,shapeCache=[],fontOK=false;
  var SHAPES=['Trái tim','Vòng tròn','Ngôi sao','Chữ'];
  var countEl=document.getElementById('count'),lessB=document.getElementById('less'),moreB=document.getElementById('more'),shown=-1;
  /* chế độ Vụ nổ: bst=1 đang nén (bq=độ nén 0..1), bst=2 sau khi nhả: rung, bắn vài nhịp sóng xung kích rồi mới nổ.
     (bx,by)=tâm quả cầu, fxs=hiệu ứng đang chạy (sóng xung kích và vụ nổ).
     Chỉ dùng được khi đủ NEED chú: 600 trên PC và tablet, 200 trên điện thoại */
  var bst=0,bq=0,bgate=0,bx=0,by=0,bgt=0,fxs=[],bw=0,BT1=40,BN=3,BPI=15,BDET=14,bpuls=0,bec=0,bsx=0,bsy=0,bpg=0,bph=0,phone=false,NEED=600,needT=0,
      blastB=document.querySelector('[data-m=blast]'),needEl=document.getElementById('need');
  function pick(){return color===6?Math.floor(Math.random()*COLORS.length):color}

  /* gợi ý số đom đóm: điện thoại 200 chú, PC và tablet 600 chú */
  var mac=/Mac|iPhone|iPad/i.test(navigator.platform||navigator.userAgent||''),tipEl=document.getElementById('tip');
  function setTip(){
    tipEl.textContent=touch
      ?'Gợi ý: thả khoảng '+NEED+' chú đom đóm để cả bầu trời cùng sáng lên.'
      :'Gợi ý: nhấn '+(mac?'Control + Command + F':'F11')+' để vào toàn màn hình, rồi thả khoảng '+NEED+' chú đom đóm để cả bầu trời cùng sáng lên.';
  }
  function lockBlast(){blastB.setAttribute('aria-disabled',String(flies.length<NEED))}
  function needMsg(){
    tipEl.textContent='Vụ nổ cần từ '+NEED+' chú đom đóm. Hiện có '+flies.length+' chú, bấm +50 để thả thêm.';
    clearTimeout(needT);needT=setTimeout(setTip,4500);
  }

  /* chữ "Đom đóm" chỉ được lấy mẫu sau khi font tải xong, nếu không đàn sẽ xếp theo font dự phòng */
  if(document.fonts&&document.fonts.load){
    document.fonts.load('600 40px "Be Vietnam Pro"','Đom đóm').then(done,done);
  }else fontOK=true;
  function done(){fontOK=true;shapeCache[3]=null;if(mode==='shape'&&shapeIdx===3)spts=buildShape(3)}

  function makeSprite(c){
    var s=document.createElement('canvas');s.width=s.height=128;
    var g=s.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64),k=c[0]+','+c[1]+','+c[2];
    r.addColorStop(0,'rgba(255,255,255,1)');
    r.addColorStop(.09,'rgba(255,255,255,1)');
    r.addColorStop(.13,'rgba('+k+',1)');
    r.addColorStop(.17,'rgba('+k+',.5)');
    r.addColorStop(.28,'rgba('+k+',.22)');
    r.addColorStop(.5,'rgba('+k+',.08)');
    r.addColorStop(.75,'rgba('+k+',.02)');
    r.addColorStop(1,'rgba('+k+',0)');
    g.fillStyle=r;g.fillRect(0,0,128,128);return s;
  }
  function makeCore(){
    var s=document.createElement('canvas');s.width=s.height=32;
    var g=s.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);
    r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.55,'rgba(255,255,255,1)');r.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=r;g.fillRect(0,0,32,32);return s;
  }
  function setHint(){
    var V=touch?'Chạm giữ':'Giữ chuột',C=touch?'Chạm':'Nhấp chuột',
        jets=JV?'lên trên và xuống dưới':'sang trái và sang phải';
    var T={follow:V+' để đàn đom đóm bay theo con trỏ. Nhả ra thì chúng bay tự do.',
      swirl:V+' để đàn xoáy quanh con trỏ như đĩa sao quanh hố đen. Kéo nhanh để quăng đàn ra.',
      flee:V+' để đẩy đàn ra xa con trỏ.',
      hole:V+' để hút đàn vào hố đen. Chúng quay vài vòng, thu hẹp dần rồi bị nuốt và phóng ra thành hai tia sáng '+jets+'.',
      trail:V+' rồi di chuyển để vẽ bằng ánh sáng.',
      sync:V+' để nhịp nhấp nháy lan ra như sóng và cả đàn sáng cùng nhịp.',
      shape:V+' để đàn xếp thành hình. Bấm lại nút này để đổi hình.',
      flock:V+' để dẫn đầu bầy. Đàn tự bay theo bầy như chim sáo.',
      fire:C+' để bắn pháo hoa.',
      blast:flies.length<NEED?'Vụ nổ cần từ '+NEED+' chú đom đóm. Hiện có '+flies.length+' chú, bấm +50 để thả thêm.'
        :V+' để nén đàn thành quả cầu sáng, giữ càng lâu càng nén chặt. Nhả ra: đàn rung lên, phát sóng xung kích rồi nổ tung.'};
    document.getElementById('hint').textContent=T[mode];
  }
  function explode(){
    var c0=color===6?Math.floor(Math.random()*COLORS.length):color;
    for(var i=0;i<flies.length;i++){
      var f=flies[i],a=Math.random()*6.283,sp=(Math.random()<.7?10:3+Math.random()*8)*(.9+Math.random()*.25);
      f.vx=Math.cos(a)*sp;f.vy=Math.sin(a)*sp;f.fb=1;f.gl=1;f.c=c0;
    }
    return c0;
  }
  function buildShape(k){
    if(shapeCache[k])return shapeCache[k];
    var P=[],n=900,i,t;
    if(k===0){for(i=0;i<n;i++){t=i/n*6.2832;P.push([16*Math.pow(Math.sin(t),3)/17,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/17])}}
    else if(k===1){for(i=0;i<n;i++){t=i/n*6.2832;P.push([Math.cos(t),Math.sin(t)])}}
    else if(k===2){
      var V=[];for(i=0;i<10;i++){var rr=i%2?.42:1,aa=-Math.PI/2+i*Math.PI/5;V.push([rr*Math.cos(aa),rr*Math.sin(aa)])}
      for(i=0;i<n;i++){var u=i/n*10,e0=Math.floor(u),ff=u-e0,A=V[e0%10],B=V[(e0+1)%10];P.push([A[0]+(B[0]-A[0])*ff,A[1]+(B[1]-A[1])*ff])}
    }else{
      var c=document.createElement('canvas');c.width=640;c.height=200;
      var g=c.getContext('2d');g.fillStyle='#fff';g.font='600 150px "Be Vietnam Pro",system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('Đom đóm',320,100);
      var d=g.getImageData(0,0,640,200).data;
      for(var y=0;y<200;y+=4)for(var x=0;x<640;x+=4)if(d[(y*640+x)*4+3]>128)P.push([(x-320)/320,(y-100)/320]);
      if(!P.length)P.push([0,0]);
      if(!fontOK)return P;
    }
    return shapeCache[k]=P;
  }

  /* ===== bầu trời sao đêm ===== */
  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  var PAL=[[255,255,255],[200,220,255],[170,195,255],[255,236,205],[255,214,190]];
  /* sao nhấp nháy: sinh một lần ở toạ độ chuẩn hoá nên đổi kích thước màn hình không làm sao nhảy chỗ.
     Mỗi sao có nhịp riêng gồm ba sóng lệch nhau (nhanh, vừa, chậm) và biên độ riêng, nên độ sáng chập chờn bất định như sao thật */
  var PALCSS=PAL.map(function(c){return'rgb('+c[0]+','+c[1]+','+c[2]+')'});
  var TW=[],TWG=[[],[],[],[],[]],nT=0,nBig=0,shoot=null,skyT=0,nextShoot=4000;
  (function(){var R=rng(99);for(var i=0;i<1000;i++){
    var big=i<14,g=Math.floor(R()*PAL.length);
    TW.push({i:i,u:R(),v:R()*.98,t:R(),o:R()+R()+R()+R()-2,band:!big&&R()<.4,g:g,c:PAL[g],x:0,y:0,al:0,
      r:big?1.3+R()*.9:(R()<.12?.8+R()*.5:.3+R()*.4),a:big?.9:.42+R()*.58,

        var sf=Math.sqrt(f.vx*f.vx+f.vy*f.vy)+1e-4,kf=(3.6-sf)*.1*dt/sf;f.vx+=f.vx*kf;f.vy+=f.vy*kf;
      }
      if(pw>.01){
        var dx=ptr.x-f.x,dy=ptr.y-f.y,d=Math.sqrt(dx*dx+dy*dy)+1,nx=dx/d,ny=dy/d,p=Math.min(260/(d+40),4)*.1*k*dt/f.m;
        if(mode==='follow'){f.vx+=nx*p;f.vy+=ny*p}
        else if(mode==='blast'){
          /* đang nén: gom đàn đúng như chế độ bay theo, độ nén chỉ làm quả cầu sáng dần */

            f.vx+=nx*p;f.vy+=ny*p;
            if(ec>0){
              /* nén chặt: nửa đầu giống bay theo, về sau lò xo kéo thẳng vào tâm mạnh dần và ma sát tăng để đàn dồn thành một khối */
              var cq=Math.min(d*ec*ec*.07,1.2*ec*ec)*pw*dt,cdm=Math.pow(1-.14*ec*ec,dt);

          }
        }
        else if(mode==='swirl'){
          /* lốc xoáy: dây chun đàn hồi nối với con trỏ + quán tính thật. Con trỏ nhanh thì đàn bị quăng ra rồi bị kéo lại */
          var Rt=(36+(DK-36)*Math.pow(f.h,1.4))*f.rj,
              rx=f.vx-cvx,ry=f.vy-cvy,
              vtan=-rx*ny+ry*nx,vrad=rx*nx+ry*ny,
              e=d-Rt,kr=.12*(1-.55*f.h),
              ar=(e>0?kr*e+.0004*e*e:kr*e*.5)+vtan*vtan/Math.max(d,12)*.95-.08*vrad,
              at=(13.4*(1+exc)*Math.max(.5,Math.min(1,Math.sqrt(70/Rt)))-vtan)*.07,

        else if(mode==='hole'){
          /* hs=0: bị hút lại gần; hs=3: quay quanh hố đen vài vòng, quỹ đạo co dần; hs=1: bị nuốt rồi bắn ra xa; hs=2: vừa bị bắn ra, hãm lại rồi được hút về như lúc hố đen mới xuất hiện */
          var Rh=HR*pw;
          if(f.hs===1){
            f.hj-=dt;if(f.hj<=0){f.hs=2;f.hg=0}
            f.vx*=dmp>0?1/dmp*.998:1;f.vy*=dmp>0?1/dmp*.998:1;f.gl=Math.max(f.gl,.8);
          }else if(f.hs===3){
            /* quỹ đạo xoắn ốc: bán kính giảm theo góc đã quét (đúng f.nt vòng từ lúc vào đĩa tới lúc bị nuốt), càng vào trong càng quay nhanh */
            var ovt=-f.vx*ny+f.vy*nx,ovr=f.vx*nx+f.vy*ny,og=pw*dt/f.m;
            if(d>OD*1.8){f.hs=0}
            else{
              f.or*=Math.exp(-f.lam*Math.max(ovt/Math.max(d,12)*dt,.004*dt));
              if(f.or<RC*1.8)f.or-=3*dt;            /* chặng cuối: lao thẳng xuống */
              if(f.or<RC*.6)f.or=RC*.6;
              var ovT=Math.min(26,15.5*Math.sqrt(OD/270)*Math.sqrt(OD*.5/Math.max(d,RC*.8))),
                  oar=Math.max(-8,Math.min(8,(d-f.or)*.14-.1*ovr))+Math.min(40,ovt*ovt/Math.max(d,12))*.95,  /* lực kéo về quỹ đạo (có giới hạn) + lực hướng tâm giữ vòng tròn */
                  oat=(ovT-ovt)*.07;
              f.vx+=(nx*oar-ny*oat)*og;f.vy+=(ny*oar+nx*oat)*og;
              f.gl=Math.max(f.gl,.25+.4*(1-Math.min(1,d/OD)));
            }
          }else{
            /* hs=0 và hs=2 dùng chung một lực hút. Với hs=2 (vừa bị bắn ra): hãm lại rồi lực hút tăng dần từ 0 lên đầy đủ
               trong khoảng 70 khung hình, giống lúc nhấn giữ khiến hố đen vừa hiện ra và hút đàn từ từ */
            var hg=1;
            if(f.hs===2){
              f.hg=Math.min(1,f.hg+dt/70);hg=f.hg;
              if(hg<.5){var hbk=Math.pow(.94,dt);f.vx*=hbk;f.vy*=hbk}
              if(f.hg>=1)f.hs=0;
            }
            var vt=Math.min(16,95/Math.sqrt(d+10)),vi=3+80/(d+20),
                vtn=-f.vx*ny+f.vy*nx,vrn=f.vx*nx+f.vy*ny,gd=pw*dt/f.m*hg,
                ard=Math.min(8,vtn*vtn/Math.max(d,20)+(vi-vrn)*.08),atd=(vt-vtn)*.07;
            f.vx+=(nx*ard-ny*atd)*gd;f.vy+=(ny*ard+nx*atd)*gd;
            if(d<90)f.gl=Math.max(f.gl,.5*(1-d/90));
            if(f.hs===0&&d<OD*.9*f.rj){f.hs=3;f.or=Math.max(d,ORMIN);f.lam=Math.log(f.or/RC)/(6.283*f.nt*(OD>200?.8:1))}  /* vào đĩa: bắt đầu quay quanh */
          }
          if(f.hs!==1&&d<Math.max(30,HR*1.5)&&pw>.3){
            /* bị nuốt vào rồi bắn ra thành hai tia: PC bắn trái và phải, điện thoại bắn lên và xuống */
            var sg=Math.random()<.5?-1:1,ang=(Math.random()-.5)*.9,hjv=32+Math.random()*14,js=JSPAN/hjv*(.8+Math.random()*.4),
                sa=Math.sin(ang),ca=Math.cos(ang);
            if(JV){f.x=ptr.x+sa*Rh*.5;f.y=ptr.y+sg*(Rh+2);f.vx=sa*js;f.vy=sg*ca*js}
            else{f.x=ptr.x+sg*(Rh+2);f.y=ptr.y+sa*Rh*.5;f.vx=sg*ca*js;f.vy=sa*js}
            f.hs=1;f.hj=hjv;f.gl=1;hb=Math.min(1,hb+.03)}}
        else if(mode==='trail'){
          var T=trl.length;
          if(T){var tp=trl[T-1-Math.min(T-1,Math.floor(f.h*(T-1)))],fz=4+f.h*16,gk=pw*dt;
            f.vx+=((tp.x+Math.cos(f.ph+s*f.sp*.7)*fz-f.x)*.09-f.vx*.12)*gk;
            f.vy+=((tp.y+Math.sin(f.ph*1.3+s*f.sp*.6)*fz-f.y)*.09-f.vy*.12)*gk}}
        else if(mode==='sync'){
          var wr=Math.min(2600,(t-ptr.t0)*.6);
          if(d<wr){f.th+=Math.sin(M-f.th)*.07*dt*pw;if(d>wr-40)f.gl=1}}
        else if(mode==='shape'&&spts){
          var sq=spts[Math.floor(f.u*spts.length)],cx2=Math.max(SS,Math.min(W-SS,ptr.x)),cy2=Math.max(SS,Math.min(H-SS,ptr.y)),gk2=pw*dt;
          f.vx+=((cx2+sq[0]*SS+Math.cos(f.ph+s*2)*2-f.x)*.07-f.vx*.14)*gk2;
          f.vy+=((cy2+sq[1]*SS+Math.sin(f.ph+s*2)*2-f.y)*.07-f.vy*.14)*gk2}
        else if(mode==='flock'){f.vx+=nx*p*.5;f.vy+=ny*p*.5}
        else if(mode==='flee'){ if(d<88){f.vx-=nx*p*2.2;f.vy-=ny*p*2.2} }
      }
      f.vx*=dmp;f.vy*=dmp;
      f.x+=f.vx*dt;f.y+=f.vy*dt;
      var m=f.sz*.5;if(f.x<m){f.x=m;f.vx=Math.abs(f.vx)*.9;f.w=Math.PI-f.w}else if(f.x>W-m){f.x=W-m;f.vx=-Math.abs(f.vx)*.9;f.w=Math.PI-f.w}
      if(f.y<m){f.y=m;f.vy=Math.abs(f.vy)*.9;f.w=-f.w}else if(f.y>H-m){f.y=H-m;f.vy=-Math.abs(f.vy)*.9;f.w=-f.w}
      var spd=Math.sqrt(f.vx*f.vx+f.vy*f.vy),a=Math.min(1,(.35+.65*Math.max(0,Math.sin(f.th)))*1.3+sw*Math.min(spd*.015,.2)+f.gl*.6);

    ctx.globalAlpha=1;ctx.setTransform(DPR,0,0,DPR,0,0);
    var cc=COLORS[color===6?0:color],cs2=cc[0]+','+cc[1]+','+cc[2];
    if(pw>.01&&mode!=='hole'&&mode!=='fire'&&mode!=='blast'){var ra=40+40*pw;ctx.globalAlpha=.35*pw;ctx.drawImage(sprites[color===6?0:color],ptr.x-ra,ptr.y-ra,ra*2,ra*2);ctx.globalAlpha=1}
    if(mode==='blast'&&(bst===1||bst===2)){
      /* quả cầu: lúc nén thì co nhỏ lại, sáng dần, nhịp đập nhanh dần và hơi run; lúc rung thì nhấp nháy và phập phồng theo từng nhịp sóng */
      var ci=color===6?0:color,wind=bst===2,e2=wind?1:ec,
          ro=wind?(15+12*bpg)*(1+.08*Math.sin(bw*1.3)):(26-12*ec)*(1+(.04+.06*ec)*Math.sin(s*(6+16*ec))),
          ox=bx+(wind?bsx:(Math.random()-.5)*3*ec*ec),oy=by+(wind?bsy:(Math.random()-.5)*3*ec*ec),
          fk=wind?.8+.2*Math.random():1,rk,ur2,rr;
      ctx.globalAlpha=(.3+.6*e2)*fk;ctx.drawImage(sprites[ci],ox-ro*5,oy-ro*5,ro*10,ro*10);

      ctx.strokeStyle='rgb('+cs2+')';ctx.lineWidth=1;
      for(rk=0;rk<3;rk++){
        ur2=(bph+rk/3)%1;rr=ro*1.4+BR*.55*Math.pow(1-ur2,1.6);
        ctx.globalAlpha=.26*Math.sin(ur2*Math.PI)*(.35+.65*e2)*Math.min(1,bgate*2);
        ctx.beginPath();ctx.arc(ox,oy,rr,0,6.283);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    for(var qi=fxs.length-1;qi>=0;qi--){
      /* hiệu ứng nổ: tia chớp, ba sóng xung kích nối nhau, ánh tàn ở tâm */
      var X=fxs[qi],tt=X.t+=dt;
      if(X.p){
        /* nhịp sóng xung kích trước khi nổ: một vòng sáng mảnh lan ra rồi tắt, kèm vòng màu chạy theo sau */
        var up2=tt/40;
        if(up2>=1){fxs.splice(qi,1);continue}
        var pc=COLORS[X.c],Rp=X.R*(1-Math.pow(1-up2,2.6)),pa=.9*Math.pow(1-up2,1.4);
        ctx.strokeStyle='rgb(255,248,235)';
        ctx.globalAlpha=pa*.18;ctx.lineWidth=(1-up2)*10+3;ctx.beginPath();ctx.arc(X.x,X.y,Rp,0,6.283);ctx.stroke();
        ctx.globalAlpha=pa;ctx.lineWidth=(1-up2)*2.4+.6;ctx.beginPath();ctx.arc(X.x,X.y,Rp,0,6.283);ctx.stroke();

        ctx.globalAlpha=pa*.5;ctx.lineWidth=(1-up2)*1.6+.4;ctx.beginPath();ctx.arc(X.x,X.y,Rp*.82,0,6.283);ctx.stroke();

      var xc=COLORS[X.c],xs=xc[0]+','+xc[1]+','+xc[2],uF=tt/24,uE=tt/70,ri,dur,ur3,Rr,al;
      if(uF<1){
        var fR=30+X.R*.5*(1-Math.pow(1-uF,3)),fa2=.95*(1-uF)*(1-uF),fg=ctx.createRadialGradient(X.x,X.y,0,X.x,X.y,fR);

        ctx.globalAlpha=al*.2;ctx.lineWidth=(1-ur3)*9+2;ctx.beginPath();ctx.arc(X.x,X.y,Rr,0,6.283);ctx.stroke();
        ctx.globalAlpha=al;ctx.lineWidth=(1-ur3)*2.2+.5;ctx.beginPath();ctx.arc(X.x,X.y,Rr,0,6.283);ctx.stroke();
      }
      if(uE<1){var eR=26+60*uE;ctx.globalAlpha=.6*(1-uE)*(1-uE);ctx.drawImage(sprites[X.c],X.x-eR,X.y-eR,eR*2,eR*2)}
      ctx.globalAlpha=1;
    }
    if(rp){rp.t+=dt;var ur=rp.t/45;
      if(ur>=1)rp=null;else{ctx.globalAlpha=.55*(1-ur)*(1-ur);ctx.strokeStyle='rgb('+cs2+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(rp.x,rp.y,20+ur*170,0,6.283);ctx.stroke();ctx.globalAlpha=1}}
    if(fl){fl.t+=dt;var uf=fl.t/18;
      if(uf>=1)fl=null;else{var fr=30+uf*190;ctx.globalAlpha=.9*(1-uf)*(1-uf);ctx.drawImage(sprites[fl.c],fl.x-fr,fl.y-fr,fr*2,fr*2);ctx.globalAlpha=1}}

      var hr=HR*pw,hx=ptr.x,hy=ptr.y,gr=ctx.createRadialGradient(hx,hy,hr*.9,hx,hy,hr*4.2);
      gr.addColorStop(0,'rgba('+cs2+',0)');
      gr.addColorStop(.03,'rgba(255,250,235,'+(.95*pw)+')');
      var hg=1+hb*.8;gr.addColorStop(.07,'rgba('+cs2+','+Math.min(1,.6*pw*hg)+')');
      gr.addColorStop(.21,'rgba('+cs2+','+Math.min(1,.18*pw*hg)+')');
      gr.addColorStop(.5,'rgba('+cs2+','+(.05*pw)+')');
      gr.addColorStop(1,'rgba('+cs2+',0)');
      ctx.fillStyle=gr;ctx.fillRect(hx-hr*4.2,hy-hr*4.2,hr*8.4,hr*8.4);
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#02040c';ctx.beginPath();ctx.arc(hx,hy,hr*.98,0,6.283);ctx.fill();
    }
    if(shown!==flies.length)syncCount();
    if(!reduce&&t-skyT>33){skyT=t;drawSky(t)}
    requestAnimationFrame(step);
  }
  function syncCount(){
    var n=flies.length;shown=n;countEl.textContent=n+' con';
    lessB.setAttribute('aria-disabled',String(n<=MIN));moreB.setAttribute('aria-disabled',String(n>=MAX));
    lockBlast();if(mode==='blast')setHint();
  }

  /* ===== con trỏ: chỉ theo một ngón/chuột đầu tiên, bỏ qua ngón thứ hai ===== */
  /* cảm ứng: ở chế độ xoáy và hố đen, tâm hiệu ứng nằm phía trên đầu ngón tay (FOFF px) để ngón tay không che mất */
  var FOFF=80;
  function pos(e){

    else rp={x:ptr.x,y:ptr.y,t:0};

  cv.addEventListener('pointercancel',up);
  cv.addEventListener('lostpointercapture',up);
  addEventListener('blur',function(){up()});
  cv.addEventListener('contextmenu',function(e){e.preventDefault()});

  /* ===== bảng điều khiển ===== */
  var mlist=document.getElementById('modes'),mbtn=document.getElementById('modebtn');
  function setList(o){mlist.hidden=!o;mbtn.setAttribute('aria-expanded',String(o))}
  mlist.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.getAttribute('aria-disabled')==='true'){needMsg();return}
    var nm=b.dataset.m,wasShape=mode==='shape';
    if(nm==='shape'){if(wasShape)shapeIdx=(shapeIdx+1)%SHAPES.length;spts=buildShape(shapeIdx);b.textContent='Hình: '+SHAPES[shapeIdx]}
    if(nm!==mode){
      /* dọn trạng thái của chế độ cũ: tên lửa pháo hoa, vệt vẽ, trạng thái hố đen */
      fw=null;trl=[];bst=0;bq=0;
      for(var i=0;i<flies.length;i++){flies[i].hs=0;flies[i].hj=0}
    }
    mode=nm;setHint();document.getElementById('modename').textContent=(b.querySelector('.lbl')||b).textContent;if(!(nm==='shape'&&wasShape))setList(false);

  });
  document.getElementById('dots').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;color=+b.dataset.c;
    [].forEach.call(this.children,function(x){x.setAttribute('aria-pressed',String(x===b))});
    for(var i=0;i<flies.length;i++){flies[i].c=pick()}
  });
  /* bấm một lần = ±50, giữ nút = lặp nhanh. Bàn phím kích hoạt qua sự kiện click (detail === 0) */
  function hold(btn,fn){
    var t1=0,t2=0;
    function stop(){clearTimeout(t1);clearInterval(t2);t1=t2=0}
    btn.addEventListener('pointerdown',function(e){
      if(e.pointerType==='mouse'&&e.button!==0)return;
      stop();fn();t1=setTimeout(function(){t2=setInterval(fn,60)},400);
    });

    btn.addEventListener('blur',stop);
    btn.addEventListener('click',function(e){if(e.detail===0)fn()});
    btn.addEventListener('contextmenu',function(e){e.preventDefault()});
  }
  hold(lessB,dropFlies);hold(moreB,addFlies);
  document.getElementById('reset').onclick=reset;
  mbtn.onclick=function(e){e.stopPropagation();setList(mlist.hidden)};
  document.addEventListener('pointerdown',function(e){if(!mlist.hidden&&!e.target.closest('.modewrap'))setList(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!mlist.hidden){setList(false);mbtn.focus()}});
  var bar=document.getElementById('bar'),tg=document.getElementById('toggle');

    var hide=!bar.classList.contains('hide');
    if(hide)setList(false);

  };
  addEventListener('resize',onResize);
  addEventListener('orientationchange',function(){onResize();setTimeout(resize,300)});
  if(window.visualViewport)visualViewport.addEventListener('resize',onResize);

  resize();reset();requestAnimationFrame(step);
})();
